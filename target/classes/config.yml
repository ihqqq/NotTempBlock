# plugin NotTempBlock được phát triển
# để phục vụ cho các dự án của NotMC Network
# "Thằng nào leak plugin là con chó ghẻ" Tist, Mist, Phist said

# Các thế giới (world) sẽ áp dụng tính năng tự động xóa block/entity.
enabled-worlds:
  - world
  - world_nether

# Nếu đặt true, người chơi có quyền 'nottempblock.bypass'
# có thể đặt block/entity mà không bị tự động xóa.
bypass-permission: true

# Nếu đặt true, yêu cầu WorldGuard phải được cài đặt.
# Plugin sẽ đăng ký 3 flag WorldGuard:
#
#   block-temp (default: allow)
#     → Region set DENY sẽ không áp dụng tự động xóa block.
#
#   entity-temp (default: allow)
#     → Region set DENY sẽ không áp dụng tự động xóa entity.
#
#   allow-configured-blocks (default: deny)
#     → Region set ALLOW sẽ cho phép đặt các block/entity có trong config.yml
#       ngay cả khi các flag khác (vd: build: deny) đang chặn việc đặt block.
#       Flag này override WorldGuard và các plugin khác.
#       Ví dụ dùng: /rg flag <region> allow-configured-blocks allow
#
worldguard-hook: true

# Cài đặt Block
# Nếu all-blocks.enabled là true, MỌI block được đặt sẽ là tạm thời
# và các mục block riêng lẻ bên dưới sẽ bị bỏ qua.
all-blocks:
  enabled: false
  time-seconds: 20

# Thời gian xóa từng loại block (tính bằng giây).
# Sử dụng tên enum Material của phiên bản server bạn đang dùng.
# Xem thêm: https://jd.papermc.io/paper/1.21/org/bukkit/Material.html
blocks:
  COBWEB: 30
  OBSIDIAN: 40
  TNT: 5

# Cài đặt Entity
# Thời gian xóa từng loại entity (tính bằng giây).
# Các loại entity được hỗ trợ: ARMOR_STAND, BOAT, MINECART, END_CRYSTAL, v.v.
# Xem thêm: https://jd.papermc.io/paper/1.21/org/bukkit/entity/EntityType.html
entities:
  END_CRYSTAL: 10
  ARMOR_STAND: 60