# plugin NotTempBlock được phát triển
# để phục vụ cho các dự án của NotMC Network
# "Thằng nào leak plugin là con chó ghẻ" Tist, Mist, Phist said

# Các thế giới (world) sẽ áp dụng tính năng tự động xóa block/entity.
enabled-worlds:
  - world
  - world_nether

# Nếu đặt true, người chơi có quyền 'nottempblock.bypass'
# có thể đặt block/entity mà không bị tự động xóa.
bypass-permission: true

# Nếu đặt true, yêu cầu WorldGuard phải được cài đặt.
# Plugin sẽ đăng ký 3 flag WorldGuard:
#
#   block-temp (default: allow)
#     → Region set DENY sẽ không áp dụng tự động xóa block.
#
#   entity-temp (default: allow)
#     → Region set DENY sẽ không áp dụng tự động xóa entity.
#
#   allow-configured-blocks (default: deny)
#     → Region set ALLOW sẽ cho phép đặt các block/entity có trong config.yml
#       ngay cả khi các flag khác (vd: build: deny) đang chặn việc đặt block.
#       Flag này override WorldGuard và các plugin khác.
#       CHỈ áp dụng cho các block được khai báo TRỰC TIẾP trong mục "blocks"
#       bên dưới — không áp dụng cho mọi block dù all-blocks đang bật.
#       Ví dụ dùng: /rg flag <region> allow-configured-blocks allow
#
worldguard-hook: true

# Hiển thị số giây còn lại trước khi block bị xóa (dạng chữ nổi phía trên block).
# Sử dụng entity TextDisplay của Minecraft, không cần plugin ngoài.
countdown-display:
  enabled: true
  # %time% sẽ được thay bằng số giây còn lại. Hỗ trợ mã màu '&'.
  format: "&e%time%s"
  # Khoảng cách hiển thị phía trên tâm block (theo trục Y).
  y-offset: 1.2

# Cài đặt Block
# Nếu all-blocks.enabled là true, MỌI block được đặt sẽ là tạm thời
# (theo thời gian all-blocks.time-seconds dưới đây) — TRỪ các block đã
# được khai báo riêng trong mục "blocks" bên dưới VÀ các block trong
# "blacklist-blocks". Đây chính là "chế độ blacklist": bật all-blocks,
# rồi dùng blacklist-blocks để loại trừ những block không muốn bị xóa.
all-blocks:
  enabled: false
  time-seconds: 20

# Thời gian xóa từng loại block (tính bằng giây).
# Các block trong danh sách này LUÔN dùng thời gian riêng ở đây,
# kể cả khi all-blocks.enabled = true (trừ khi cũng nằm trong blacklist-blocks).
# Sử dụng tên enum Material của phiên bản server bạn đang dùng.
# Xem thêm: https://jd.papermc.io/paper/1.21/org/bukkit/Material.html
blocks:
  COBWEB: 30
  OBSIDIAN: 40
  TNT: 5

# Blacklist block – "chế độ blacklist".
# Danh sách các block sẽ KHÔNG BAO GIỜ bị tự động xóa, kể cả khi
# all-blocks.enabled = true hoặc block đó cũng có mặt trong mục "blocks"
# ở trên (blacklist luôn được ưu tiên cao nhất).
# Có thể cấu hình trực tiếp tại đây hoặc dùng GUI in-game:
#   /nottempblock blacklist
# (hoặc click "Quản lý Blacklist" trong GUI whitelist: /nottempblock gui)
blacklist-blocks: []

# Cài đặt Entity
# Thời gian xóa từng loại entity (tính bằng giây).
# Các loại entity được hỗ trợ: ARMOR_STAND, BOAT, MINECART, END_CRYSTAL, v.v.
# Xem thêm: https://jd.papermc.io/paper/1.21/org/bukkit/entity/EntityType.html
entities:
  END_CRYSTAL: 10
  ARMOR_STAND: 60